# Every push and PR is linted, tested and built. A tag like v1.1.0 also publishes a GitHub release.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write  # gh release create

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      # Window tests need an interactive desktop and stay a manual pre-tag check (HANDOFF.md).
      - name: Unit tests
        run: |
          $env:LOCALAPPDATA = Join-Path $PWD 'target/ci-data'
          cargo test --locked --lib -- --test-threads=1 --skip files_survive_a_trip_through_the_clipboard

      - name: Build
        run: cargo build --locked --release --bin kestrel

      # The .pdb symbolicates crash dumps users send from %LOCALAPPDATA%\Kestrel\crashes.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/kestrel.exe "dist/kestrel-$env:VERSION-x64.exe"
          Compress-Archive target/release/kestrel.pdb "dist/kestrel-$env:VERSION-x64-symbols.zip"
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName --title "Kestrel $env:VERSION" --generate-notes --verify-tag
