# Every push and PR is linted, tested and built, installer included. A tag like v1.2.0 also builds
# a draft GitHub release with the exe, the MSI installer, symbols and checksums.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write  # gh release create

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional: a base64 code-signing .pfx. Without it, releases are unsigned.
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      # Window tests need an interactive desktop and stay a manual pre-tag check (HANDOFF.md).
      - name: Unit tests
        run: |
          $env:LOCALAPPDATA = Join-Path $PWD 'target/ci-data'
          cargo test --locked --lib -- --test-threads=1 --skip files_survive_a_trip_through_the_clipboard

      - name: Build
        run: cargo build --locked --release --bin kestrel

      # Before the installer is built, so the program inside it is signed too.
      - name: Sign program
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_PFX != ''
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./.github/sign.ps1 target/release/kestrel.exe

      # Per-user MSI from installer/kestrel.wxs. WiX 7 asks for a license acceptance; 6 doesn't.
      - name: Installer
        run: |
          $wix = Join-Path $env:RUNNER_TEMP wix
          dotnet tool install wix --version 6.0.2 --tool-path $wix
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & "$wix/wix.exe" build installer/kestrel.wxs -arch x64 -d Version=$version -o target/kestrel.msi
          if ($LASTEXITCODE) { throw "wix build failed" }

      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_PFX != ''
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./.github/sign.ps1 target/kestrel.msi

      # The .pdb symbolicates crash dumps users send from %LOCALAPPDATA%\Kestrel\crashes.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/kestrel.exe "dist/kestrel-$env:VERSION-x64.exe"
          Copy-Item target/kestrel.msi "dist/kestrel-$env:VERSION-x64.msi"
          Compress-Archive target/release/kestrel.pdb "dist/kestrel-$env:VERSION-x64-symbols.zip"
          Get-ChildItem dist | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)`n" } |
            Set-Content -NoNewline dist/SHA256SUMS.txt  # LF, so sha256sum -c works

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist).FullName --title "Kestrel v$env:VERSION" --draft --generate-notes --verify-tag
